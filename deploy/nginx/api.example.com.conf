# NestJS REST API + Socket.IO  ->  https://api.example.com
# Replace every "api.example.com" with the real host name. Install as
#   /etc/nginx/sites-available/api.example.com.conf  (symlink into sites-enabled)
#
# MySQL and Redis are never proxied. Both stay on 127.0.0.1 and must not be opened in the firewall.
#
# Multiple API instances: run more PM2 entries on PORT=3001, 3002, ... (ecosystem.config.cjs)
# and uncomment them in BOTH upstreams. Broadcasts and live updates go through Redis, so a
# client may connect to any instance. Adding API instances never adds Sportmonks traffic.

upstream live_score_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Socket.IO long-polling needs every request of a session on the same instance.
# Clients should use the websocket transport; ip_hash keeps the polling fallback working.
upstream live_score_socket {
    ip_hash;
    server 127.0.0.1:3000;
    # server 127.0.0.1:3001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Extra brute-force protection in front of the API's own lockout (5 failures / 15 min).
limit_req_zone $binary_remote_addr zone=live_score_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/html).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships nginx 1.24. On nginx >= 1.25.1 use "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:live_score_api_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (HSTS, nosniff, frame options, ...) are set by the API (helmet).
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;

    access_log /var/log/nginx/api.example.com.access.log;
    error_log  /var/log/nginx/api.example.com.error.log warn;

    location /socket.io/ {
        proxy_pass http://live_score_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than the Socket.IO ping interval (25 s) plus ping timeout (20 s).
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /api/v1/admin/auth/login {
        limit_req zone=live_score_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://live_score_api;
        include /etc/nginx/snippets/live-score-proxy.conf;
    }

    # Prometheus scrape endpoint (also requires METRICS_TOKEN). Allow only the scraper.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.5;   # monitoring server
        deny all;
        proxy_pass http://live_score_api;
        include /etc/nginx/snippets/live-score-proxy.conf;
    }

    # Swagger UI for the Flutter developer. To restrict it, uncomment and list allowed IPs,
    # or set SWAGGER_ENABLED=false in .env.
    # location /api/docs {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://live_score_api;
    #     include /etc/nginx/snippets/live-score-proxy.conf;
    # }

    location / {
        proxy_pass http://live_score_api;
        include /etc/nginx/snippets/live-score-proxy.conf;
    }
}
