# Next.js admin panel  ->  https://admin.example.com
# Replace every "admin.example.com" with the real host name. Install as
#   /etc/nginx/sites-available/admin.example.com.conf  (symlink into sites-enabled)
#
# The panel is a static/browser app that talks only to https://api.example.com
# (NEXT_PUBLIC_API_URL). It has no database or Redis access and holds no secrets.
# Next.js (PM2 "live-score-admin") listens on 127.0.0.1:3100 only.

upstream live_score_admin {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships nginx 1.24. On nginx >= 1.25.1 use "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:live_score_admin_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    # CSP, X-Frame-Options, nosniff, Referrer-Policy and X-Robots-Tag come from next.config.ts.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional: only office/VPN addresses may open the admin panel.
    # allow 203.0.113.0/24;
    # deny all;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/admin.example.com.access.log;
    error_log  /var/log/nginx/admin.example.com.error.log warn;

    # Hashed build assets never change; cache them for a year.
    location /_next/static/ {
        proxy_pass http://live_score_admin;
        include /etc/nginx/snippets/live-score-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://live_score_admin;
        include /etc/nginx/snippets/live-score-proxy.conf;
    }
}
