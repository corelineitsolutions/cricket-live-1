# Redis hardening for the live-score stack (Ubuntu 24.04 "redis-server", Redis 7.x).
# Apply by editing /etc/redis/redis.conf (or `include /etc/redis/live-score-redis.conf`
# at the END of redis.conf), then: sudo systemctl restart redis-server
#
# Redis must never be reachable from the internet. Never open 6379 in ufw / the cloud firewall.

# Listen on loopback only. For a private network (API on another host), add the private IP,
# e.g. "bind 127.0.0.1 -::1 10.0.0.4", and allow 6379 only from that subnet in the firewall.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Same value as REDIS_PASSWORD in the API's .env. Generate with: openssl rand -hex 32
# Keep this file root:redis 640 because it contains the password.
requirepass CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD

# Block commands the application never uses and that would wipe or expose data.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Live state, caches, locks and BullMQ data. "noeviction" keeps locks and queue data from
# being silently evicted; the app sets TTLs on every cache key, so memory stays bounded.
maxmemory 512mb
maxmemory-policy noeviction

# Live data is rebuilt by the worker within one poll, so RDB snapshots are enough.
save 900 1
save 300 100
appendonly no

# Drop dead client connections (e.g. after an API crash).
tcp-keepalive 60
timeout 0
